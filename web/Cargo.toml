[package]
name = "poker-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The poker trainer's table for the browser: the engine and coach compiled to WebAssembly"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pungoyal/poker"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
poker = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Must match the wasm-bindgen CLI that web/build.sh runs.
wasm-bindgen = "=0.2.130"
