name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "$TAG"

  binaries:
    needs: create
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal --target ${{ matrix.target }} && rustup default 1.100.0
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="poker-$TAG-$TARGET"
          mkdir "$name"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/poker.exe" "$name/"
            7z a "$name.zip" "$name" >/dev/null
            asset="$name.zip"
          else
            cp "target/$TARGET/release/poker" "$name/"
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
