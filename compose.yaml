# Play:  docker compose up --build     then open http://localhost:8080
# Test:  docker compose run --rm --build test
services:
  poker:
    build:
      context: .
      target: runtime
    image: poker
    ports:
      - "8080:8080"

  test:
    build:
      context: .
      target: test
    image: poker-test
    profiles: [test]
    entrypoint: ["true"]
