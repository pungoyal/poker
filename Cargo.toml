[package]
name = "poker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Heads-up No-Limit Hold'em trainer for the terminal: a deterministic rules engine, hand evaluator and replayable hand histories"
authors = ["Puneet Goyal"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/pungoyal/poker"
homepage = "https://github.com/pungoyal/poker"
readme = "README.md"
keywords = ["poker", "holdem", "game", "cli", "solver"]
categories = ["games", "command-line-utilities", "simulation"]
exclude = [".github/", "Dockerfile", "compose.yaml", ".dockerignore", "mise.toml"]

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
