name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        What you did, with the session's seed (shown in the session report) or
        the hand's line from an export of your hands (Settings), and your
        browser and device.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: How do you run it?
      options:
        - The published site
        - Docker
        - Built locally with web/build.sh
    validations:
      required: true
